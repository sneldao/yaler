<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Yaler — Equipment breaks. We fix it.</title>
  <desc id="og-desc">Paper-textured card with the Yaler wordmark, a headline, and a verified receipt for £420 pinned on the right.</desc>

  <!-- Paper background -->
  <rect width="1200" height="630" fill="#F4EFE6"/>

  <!-- Subtle grain feel: a few low-opacity ink washes -->
  <g fill="#12212B">
    <rect x="-40" y="-30" width="500" height="240" opacity="0.025" transform="rotate(-4 210 90)"/>
    <rect x="820" y="430" width="460" height="260" opacity="0.03" transform="rotate(5 1050 560)"/>
    <rect x="520" y="40" width="260" height="140" opacity="0.02" transform="rotate(-7 650 110)"/>
    <rect x="60" y="480" width="340" height="120" opacity="0.022" transform="rotate(3 230 540)"/>
  </g>

  <!-- Ruled work-order lines, very faint -->
  <g stroke="#12212B" stroke-width="1" opacity="0.05">
    <line x1="0" y1="158" x2="1200" y2="158"/>
    <line x1="0" y1="206" x2="1200" y2="206"/>
    <line x1="0" y1="446" x2="1200" y2="446"/>
    <line x1="0" y1="494" x2="1200" y2="494"/>
    <line x1="0" y1="542" x2="1200" y2="542"/>
  </g>

  <!-- Wordmark: Y mark + YALER -->
  <g transform="translate(80,72)">
    <rect width="44" height="44" rx="11" fill="#12212B"/>
    <path d="M12.7 11.3 L22 22.2 V33.3" fill="none" stroke="#F4EFE6" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31.3 11.3 L22 22.2" fill="none" stroke="#C45C26" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="22.2" r="2.8" fill="#2A6F6A"/>
    <text x="62" y="33" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="7" fill="#12212B">YALER</text>
  </g>

  <!-- Headline -->
  <text x="80" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#12212B">Equipment breaks.</text>
  <text x="80" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#12212B">We fix it.</text>

  <!-- Subline -->
  <text x="80" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#5C5348">Tell us what&#8217;s broken. A local engineer, inside your</text>
  <text x="80" y="512" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#5C5348">budget, receipt on the wall.</text>

  <!-- Receipt motif, rotated slightly -->
  <g transform="translate(782,128) rotate(6 155 195)">
    <!-- Card -->
    <rect x="0" y="0" width="310" height="390" rx="10" fill="#FFFAF3" stroke="#12212B" stroke-opacity="0.16"/>

    <!-- Perforated top edge: paper-coloured punch circles along the edge -->
    <g fill="#F4EFE6">
      <circle cx="24" cy="0" r="7"/>
      <circle cx="60" cy="0" r="7"/>
      <circle cx="96" cy="0" r="7"/>
      <circle cx="132" cy="0" r="7"/>
      <circle cx="168" cy="0" r="7"/>
      <circle cx="204" cy="0" r="7"/>
      <circle cx="240" cy="0" r="7"/>
      <circle cx="276" cy="0" r="7"/>
    </g>

    <!-- Receipt header -->
    <text x="155" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" letter-spacing="4" fill="#12212B">YALER</text>
    <text x="155" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="2" fill="#5C5348">JOB RECEIPT</text>

    <!-- Ruled lines -->
    <g stroke="#12212B" stroke-opacity="0.14" stroke-width="1.5">
      <line x1="28" y1="108" x2="282" y2="108"/>
      <line x1="28" y1="140" x2="282" y2="140"/>
      <line x1="28" y1="172" x2="282" y2="172"/>
      <line x1="28" y1="204" x2="250" y2="204"/>
    </g>

    <!-- Item ticks -->
    <g fill="#2A6F6A">
      <circle cx="38" cy="101" r="3"/>
      <circle cx="38" cy="133" r="3"/>
      <circle cx="38" cy="165" r="3"/>
    </g>

    <!-- Total -->
    <line x1="28" y1="238" x2="282" y2="238" stroke="#12212B" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="28" y="276" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="2" fill="#5C5348">TOTAL</text>
    <text x="282" y="282" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#12212B">&#163;420</text>

    <!-- Verified stamp -->
    <g transform="translate(170,318) rotate(-9 62 22)">
      <rect x="0" y="0" width="124" height="44" rx="4" fill="none" stroke="#2A6F6A" stroke-width="3"/>
      <rect x="3.5" y="3.5" width="117" height="37" rx="2.5" fill="none" stroke="#2A6F6A" stroke-width="1.5" stroke-opacity="0.35"/>
      <text x="62" y="30" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="3" fill="#2A6F6A">VERIFIED</text>
    </g>
  </g>
</svg>
